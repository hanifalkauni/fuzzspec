name: CI / Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Test Suite with Coverage
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Build Binaries
        run: |
          go build -v -o fuzzspec ./cmd/fuzzspec
          go build -v -o fuzzspec-mcp ./cmd/fuzzspec-mcp

      - name: Validate CLI Execution
        run: |
          ./fuzzspec version
          ./fuzzspec validate --spec ./test/fixtures/petstore.yaml
